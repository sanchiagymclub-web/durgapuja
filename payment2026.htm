<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0B1120">
  <title>Expenditure 2026</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-deep: #0B1120;
      --bg-surface: #131C2E;
      --bg-card: #1A253A;
      --bg-input: #0F172A;
      --primary: #EF4444;
      --primary-light: #F87171;
      --primary-glow: rgba(239, 68, 68, 0.25);
      --accent: #FBBF24;
      --success: #34D399;
      --danger: #F87171;
      --text-primary: #F1F5F9;
      --text-secondary: #94A3B8;
      --border-subtle: #2D3A52;
      --shadow-card: 0 8px 20px rgba(0, 0, 0, 0.5);
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 10px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Roboto', system-ui, sans-serif;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg-deep);
      color: var(--text-primary);
      overflow: hidden;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: relative;
      max-width: 520px;
      margin: 0 auto;
      background: var(--bg-deep);
      padding-top: var(--safe-top);
    }

    .main {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      background: var(--bg-deep);
      position: relative;
      padding-bottom: 180px;
    }

    .main::before {
      content: '';
      position: sticky;
      top: 0;
      left: 0;
      right: 0;
      height: 32px;
      background: linear-gradient(to bottom, var(--bg-deep) 10%, transparent);
      pointer-events: none;
      z-index: 5;
      display: block;
      margin-bottom: -32px;
    }

    /* ----- SYNC STATUS BAR ----- */
    .sync-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      background: var(--bg-deep);
      border-bottom: 1px solid var(--border-subtle);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: var(--text-secondary);
      text-transform: uppercase;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      min-height: 40px;
    }

    .sync-bar .sync-status {
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color 0.2s;
    }

    .sync-bar .sync-status i {
      font-size: 10px;
      color: var(--success);
      transition: color 0.2s;
    }

    .sync-bar .sync-status.stale i { color: #FBBF24; }
    .sync-bar .sync-status.old i { color: var(--danger); }
    .sync-bar .sync-status.syncing i { color: var(--primary-light); animation: spin 0.9s linear infinite; }

    .sync-bar .sync-status .txt { color: inherit; }

    .sync-bar .balance-mini {
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: -0.2px;
      text-transform: none;
    }

    .date-group {
      background: var(--bg-surface);
      padding: 14px 18px 10px;
      font-weight: 700;
      color: var(--primary-light);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 40px;
      z-index: 10;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.8px;
    }

    .entry-row {
      background: var(--bg-card);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 6px 12px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-subtle);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .entry-row:active { transform: scale(0.99); }

    .entry-info { flex: 1; min-width: 0; }

    .entry-info .name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .entry-info .cat {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 3px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .entry-info .cat i { font-size: 10px; color: var(--primary); }

    .entry-amount {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      text-align: right;
      flex-shrink: 0;
      letter-spacing: -0.2px;
    }

    .entry-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .entry-edit,
    .entry-del {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      transition: background 0.15s;
      border: 1px solid var(--border-subtle);
    }

    .entry-edit { color: var(--primary-light); background: var(--bg-surface); }
    .entry-edit:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
    .entry-del { color: var(--danger); background: var(--bg-surface); }
    .entry-del:hover { background: var(--danger); color: #fff; border-color: var(--danger); }

    /* ----- FLOATING BUTTONS ----- */
    .fab {
      position: fixed;
      bottom: calc(24px + var(--safe-bottom));
      right: calc(20px + (100vw - min(520px, 100vw))/2);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.45), 0 2px 6px rgba(0, 0, 0, 0.4);
      z-index: 100;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      border: 2px solid rgba(255, 255, 255, 0.1);
    }

    .fab:active {
      transform: scale(0.92);
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    .fab-sync {
      position: fixed;
      bottom: calc(96px + var(--safe-bottom));
      right: calc(20px + (100vw - min(520px, 100vw))/2);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--bg-card);
      color: var(--primary-light);
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
      z-index: 100;
      border: 1px solid var(--border-subtle);
      transition: transform 0.15s ease, background 0.2s, color 0.2s, border-color 0.2s;
    }

    .fab-sync:active { transform: scale(0.92); }

    .fab-sync.spinning i { animation: spin 0.8s linear infinite; }

    .fab-sync.ok {
      color: var(--success);
      border-color: var(--success);
      background: rgba(52, 211, 153, 0.12);
    }

    .fab-sync.err {
      color: var(--danger);
      border-color: var(--danger);
      background: rgba(248, 113, 113, 0.12);
    }

    .fab-sync:disabled { opacity: 0.7; pointer-events: none; }

    .fab-sync .badge {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 9px;
      background: var(--danger);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--bg-deep);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    /* ----- SHEET ----- */
    .sheet-scrim {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 200;
    }

    .sheet-scrim.on { opacity: 1; pointer-events: auto; }

    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-width: 520px;
      margin: 0 auto;
      background: var(--bg-surface);
      border-radius: 24px 24px 0 0;
      transform: translateY(105%);
      transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 210;
      display: flex;
      flex-direction: column;
      max-height: 92vh;
      max-height: 92dvh;
      box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.7);
      padding-bottom: var(--safe-bottom);
      border-top: 1px solid var(--border-subtle);
    }

    .sheet.on { transform: translateY(0); }

    .sheet-grip {
      width: 40px;
      height: 4px;
      border-radius: 4px;
      background: var(--border-subtle);
      margin: 12px auto 4px;
      flex-shrink: 0;
    }

    .sheet-head {
      padding: 6px 20px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .sheet-head h2 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sheet-head h2 i { color: var(--primary); font-size: 16px; }

    .sheet-close {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--bg-input);
      color: var(--text-secondary);
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-subtle);
      transition: background 0.15s;
    }

    .sheet-close:hover { background: var(--border-subtle); color: #fff; }

    .sheet-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 20px 20px;
    }

    .field { margin-bottom: 16px; }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.7px;
      margin-bottom: 8px;
    }

    .field .in {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0 14px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .field .in:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-glow);
    }

    .field .in i {
      color: var(--primary-light);
      font-size: 15px;
      flex-shrink: 0;
      width: 18px;
      text-align: center;
    }

    .field .in input,
    .field .in select {
      flex: 1;
      padding: 14px 0;
      border: none;
      background: transparent;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
      outline: none;
      min-width: 0;
      color-scheme: dark;
    }

    .field .in input::placeholder { color: #475569; }

    .balance-display {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-card);
    }

    .balance-display .lbl {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.7px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .balance-display .lbl i { color: var(--primary); }

    .balance-display .val {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.3px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      background: var(--primary);
      border-radius: var(--radius-md);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 18px rgba(239, 68, 68, 0.35);
      transition: background 0.15s, transform 0.1s;
      margin-top: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn:hover { background: #DC2626; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; pointer-events: none; }

    .msg {
      font-size: 13px;
      font-weight: 500;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      margin-top: 14px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      animation: fadeUp 0.2s ease;
      line-height: 1.4;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .msg.ok {
      background: rgba(52, 211, 153, 0.1);
      color: var(--success);
      border: 1px solid rgba(52, 211, 153, 0.25);
    }

    .msg.er {
      background: rgba(248, 113, 113, 0.1);
      color: var(--danger);
      border: 1px solid rgba(248, 113, 113, 0.25);
    }

    .msg.hide { display: none; }

    .spin {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.65s linear infinite;
    }

    .toast {
      position: fixed;
      bottom: calc(160px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--bg-card);
      color: var(--text-primary);
      padding: 14px 22px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 300;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: calc(100vw - 40px);
      border: 1px solid var(--border-subtle);
    }

    .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.err { background: #7F1D1D; border-color: #B91C1C; color: #FCA5A5; }
    .toast.ok  { background: #064E3B; border-color: #047857; color: #6EE7B7; }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
    }

    .empty i {
      font-size: 40px;
      display: block;
      margin-bottom: 16px;
      opacity: 0.4;
      color: var(--primary);
    }

    .loading { text-align: center; padding: 60px 20px; }

    .loading .spin-lg {
      display: inline-block;
      width: 36px;
      height: 36px;
      border: 3px solid var(--border-subtle);
      border-radius: 50%;
      border-top-color: var(--primary);
      animation: spin 0.65s linear infinite;
    }

    .loading p {
      margin-top: 14px;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
    }

    .confirm-scrim {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 400;
    }

    .confirm-scrim.on { opacity: 1; pointer-events: auto; }

    .confirm-box {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      width: calc(100% - 40px);
      max-width: 360px;
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      padding: 24px 22px 20px;
      z-index: 410;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      text-align: center;
      border: 1px solid var(--border-subtle);
    }

    .confirm-box.on {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .confirm-icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
    }

    .confirm-icon.warn { color: #FBBF24; border-color: #FBBF24; }
    .confirm-icon.danger { color: var(--danger); border-color: var(--danger); }

    .confirm-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
      letter-spacing: -0.2px;
    }

    .confirm-msg {
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 20px;
      font-weight: 400;
    }

    .confirm-msg b { color: var(--text-primary); font-weight: 600; }

    .confirm-actions { display: flex; gap: 10px; }

    .confirm-btn {
      flex: 1;
      padding: 13px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, transform 0.1s;
      border: 1px solid var(--border-subtle);
    }

    .confirm-btn.cancel { background: var(--bg-input); color: var(--text-secondary); }
    .confirm-btn.cancel:hover { background: var(--border-subtle); color: var(--text-primary); }
    .confirm-btn.ok { background: var(--primary); color: #fff; border-color: var(--primary); }
    .confirm-btn.ok:hover { background: #DC2626; }
    .confirm-btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
    .confirm-btn.danger:hover { background: #EF4444; }
    .confirm-btn:active { transform: scale(0.97); }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
  </style>
</head>
<body>

<div class="app">
  <main class="main" id="main">
    <div class="sync-bar">
      <div class="sync-status" id="syncStatus">
        <i class="fas fa-circle"></i>
        <span class="txt" id="syncText">Connecting…</span>
      </div>
      <div class="balance-mini" id="balanceMini">₹0</div>
    </div>

    <div class="loading" id="loadingState">
      <span class="spin-lg"></span>
      <p>Loading entries…</p>
    </div>
    <div id="entriesList"></div>
  </main>

  <button class="fab-sync" id="btnSync" aria-label="Sync now">
    <i class="fas fa-rotate"></i>
    <span class="badge" id="syncBadge" style="display:none;">0</span>
  </button>

  <button class="fab" id="btnAdd" aria-label="Add entry"><i class="fas fa-plus"></i></button>
</div>

<div class="sheet-scrim" id="formScrim"></div>
<section class="sheet" id="formSheet">
  <div class="sheet-grip"></div>
  <div class="sheet-head">
    <h2 id="formTitle"><i class="fas fa-plus-circle"></i> New Expenditure</h2>
    <button class="sheet-close" id="formClose"><i class="fas fa-xmark"></i></button>
  </div>
  <div class="sheet-body">
    <div class="balance-display">
      <span class="lbl"><i class="fas fa-wallet"></i> Live Balance</span>
      <span class="val" id="liveBalance">₹0</span>
    </div>

    <form id="entryForm">
      <input type="hidden" id="fSlNo">

      <div class="field">
        <label>Date</label>
        <div class="in">
          <i class="fas fa-calendar-day"></i>
          <input type="date" id="fDate" required>
        </div>
      </div>

      <div class="field">
        <label>Payment Made to</label>
        <div class="in">
          <i class="fas fa-user"></i>
          <input type="text" id="fName" placeholder="Recipient name" required>
        </div>
      </div>

      <div class="field">
        <label>Purpose</label>
        <div class="in">
          <i class="fas fa-tag"></i>
          <input type="text" id="fPurpose" placeholder="Reason for payment" required>
        </div>
      </div>

      <div class="field">
        <label>Amount (₹)</label>
        <div class="in">
          <i class="fas fa-indian-rupee-sign"></i>
          <input type="number" id="fAmount" placeholder="0" inputmode="numeric" required min="1">
        </div>
      </div>

      <button type="submit" class="btn" id="btnSubmit">
        <i class="fas fa-check"></i> Save Entry
      </button>
      <div class="msg hide" id="formMsg"></div>
    </form>
  </div>
</section>

<div class="confirm-scrim" id="confirmScrim"></div>
<div class="confirm-box" id="confirmBox">
  <div class="confirm-icon" id="confirmIcon"><i class="fas fa-question"></i></div>
  <div class="confirm-title" id="confirmTitle">Are you sure?</div>
  <div class="confirm-msg" id="confirmMsg">This action cannot be undone.</div>
  <div class="confirm-actions">
    <button class="confirm-btn cancel" id="confirmCancel"><i class="fas fa-xmark"></i> Cancel</button>
    <button class="confirm-btn ok" id="confirmOk"><i class="fas fa-check"></i> Confirm</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  /* ============================================================
     CONFIG
     ============================================================ */
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyFGGwcrN9Z92S1tmR9MF2uTxWVI04mKbCq0Bz1Ln8Lpj4ZP78r6oiElr89eU0DNusGhg/exec';
  const CACHE_KEY  = 'expenditure2026_v1';
  const QUEUE_KEY  = 'expenditure2026_queue_v1';

  /* ============================================================
     STATE
     ============================================================ */
  let ENTRIES = [];
  let LIVE_BALANCE = 0;
  let EDITING_SLNO = null;
  let SYNCING = false;
  let LAST_SYNCED_AT = 0;
  let statusTimer = null;

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

  /* ============================================================
     HELPERS
     ============================================================ */
  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function fmtDateDisplay(iso) {
    if (!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    if (isNaN(d)) return iso;
    return `${d.getMonth()+1}/${d.getDate()}/${d.getFullYear()}`;
  }

  function fmtMoney(n) {
    return (Number(n) || 0).toLocaleString('en-IN');
  }

  function timeAgo(ts) {
    if (!ts) return 'never';
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 5)        return 'just now';
    if (s < 60)       return s + ' sec ago';
    const m = Math.floor(s / 60);
    if (m < 60)       return m + ' min ago';
    const h = Math.floor(m / 60);
    if (h < 24)       return h + ' hr ago';
    const d = Math.floor(h / 24);
    return d + ' day' + (d > 1 ? 's' : '') + ' ago';
  }

  /* ============================================================
     SYNC STATUS BAR
     ============================================================ */
  function updateSyncStatus(state) {
    const wrap = $('syncStatus');
    const txt  = $('syncText');
    const icon = wrap.querySelector('i');

    wrap.classList.remove('syncing', 'stale', 'old');

    if (state === 'syncing') {
      wrap.classList.add('syncing');
      txt.textContent = 'Syncing…';
      icon.className = 'fas fa-rotate';
      return;
    }

    if (state === 'error') {
      wrap.classList.add('old');
      txt.textContent = 'Sync failed — tap ↻';
      icon.className = 'fas fa-circle-exclamation';
      return;
    }

    icon.className = 'fas fa-circle';
    if (!LAST_SYNCED_AT) {
      txt.textContent = 'Not synced yet';
      return;
    }
    const ageMs = Date.now() - LAST_SYNCED_AT;
    const mins  = ageMs / 60000;
    if (mins > 30)      wrap.classList.add('old');
    else if (mins > 5)  wrap.classList.add('stale');
    txt.textContent = 'Synced ' + timeAgo(LAST_SYNCED_AT);
  }

  function startStatusTicker() {
    if (statusTimer) clearInterval(statusTimer);
    statusTimer = setInterval(() => {
      if (!SYNCING) updateSyncStatus('idle');
    }, 15000);
  }

  /* ============================================================
     SYNC FAB + BADGE
     ============================================================ */
  function setSyncBtn(state) {
    const btn = $('btnSync');
    if (!btn) return;
    btn.classList.remove('spinning', 'ok', 'err');
    if (state === 'spinning') {
      btn.classList.add('spinning');
      btn.disabled = true;
    } else if (state === 'ok') {
      btn.classList.add('ok');
      btn.disabled = false;
      setTimeout(() => btn.classList.remove('ok'), 1500);
    } else if (state === 'err') {
      btn.classList.add('err');
      btn.disabled = false;
      setTimeout(() => btn.classList.remove('err'), 2200);
    } else {
      btn.disabled = false;
    }
  }

  function updateQueueBadge() {
    const n = loadQueue().length;
    const badge = $('syncBadge');
    if (!badge) return;
    if (n > 0) {
      badge.textContent = n;
      badge.style.display = 'flex';
    } else {
      badge.style.display = 'none';
    }
  }

  /* ============================================================
     LOCAL CACHE
     ============================================================ */
  function loadCache() {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      const obj = JSON.parse(raw);
      if (!obj || !Array.isArray(obj.entries)) return null;
      LAST_SYNCED_AT = obj.savedAt || 0;
      return obj;
    } catch (e) { return null; }
  }

  function saveCache() {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        entries: ENTRIES,
        liveBalance: LIVE_BALANCE,
        savedAt: LAST_SYNCED_AT || Date.now()
      }));
    } catch (e) { /* quota */ }
  }

  /* ============================================================
     OFFLINE QUEUE
     ============================================================ */
  function loadQueue() {
    try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); }
    catch (e) { return []; }
  }
  function saveQueue(q) {
    try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); } catch (e) {}
    updateQueueBadge();
  }
  function enqueue(action, params) {
    const q = loadQueue();
    q.push({ id: Date.now() + '_' + Math.random().toString(36).slice(2,7), action, params, ts: Date.now() });
    saveQueue(q);
  }
  function dequeue(id) {
    saveQueue(loadQueue().filter(x => x.id !== id));
  }

  /* ============================================================
     JSONP
     ============================================================ */
  let jsonpCounter = 0;
  function apiCall(action, params = {}, timeout = 20000) {
    return new Promise(resolve => {
      const cb = '__cb_' + (++jsonpCounter) + '_' + Date.now();
      const sc = document.createElement('script');
      const done = ok => {
        delete window[cb];
        if (sc.parentNode) sc.parentNode.removeChild(sc);
        resolve(ok);
      };
      const t = setTimeout(() => done({ success: false, message: 'Timed out' }), timeout);
      window[cb] = d => { clearTimeout(t); done(d); };
      const q = new URLSearchParams({ action, callback: cb, ...params }).toString();
      sc.src = `${SCRIPT_URL}?${q}`;
      sc.onerror = () => { clearTimeout(t); done({ success: false, message: 'Network error' }); };
      document.body.appendChild(sc);
    });
  }

  /* ============================================================
     SYNC ENGINE
     ============================================================ */
  async function syncNow({ silent = false } = {}) {
    if (SYNCING) return false;
    SYNCING = true;

    setSyncBtn('spinning');
    updateSyncStatus('syncing');

    let ok = false;
    try {
      // 1) Flush queued writes first
      const queue = loadQueue();
      for (const item of queue) {
        const r = await apiCall(item.action, item.params);
        if (r && r.success) {
          dequeue(item.id);
        } else if (r && r.message && /not found/i.test(r.message)) {
          dequeue(item.id);
        } else {
          break;
        }
      }

      // 2) Pull full dataset
      const r = await apiCall('syncAll');
      if (!r || !r.success || !r.data) {
        setSyncBtn('err');
        updateSyncStatus('error');
        if (!silent) toast('Sync failed', 'err');
        return false;
      }

      ENTRIES = r.data.entries || [];
      LIVE_BALANCE = r.data.liveBalance || 0;
      LAST_SYNCED_AT = Date.now();
      saveCache();
      renderEntries();
      updateBalanceDisplay();

      ok = true;
      setSyncBtn('ok');
      updateSyncStatus('idle');
      if (!silent) toast('Synced', 'ok');
      return true;
    } finally {
      SYNCING = false;
      if (!ok) setSyncBtn('err');
      updateQueueBadge();
    }
  }

  function updateBalanceDisplay() {
    const v = '₹' + fmtMoney(LIVE_BALANCE);
    $('balanceMini').textContent = v;
    $('liveBalance').textContent = v;
  }

  /* ============================================================
     CONFIRM
     ============================================================ */
  function askConfirm(opts) {
    return new Promise(resolve => {
      const { title, message, okText, danger, icon } = opts;
      $('confirmTitle').textContent = title;
      $('confirmMsg').innerHTML = message;
      const okBtn = $('confirmOk');
      okBtn.innerHTML = `<i class="fas ${danger ? 'fa-trash' : 'fa-check'}"></i> ${okText}`;
      okBtn.className = 'confirm-btn ' + (danger ? 'danger' : 'ok');
      const ico = $('confirmIcon');
      ico.className = 'confirm-icon ' + (danger ? 'danger' : 'warn');
      ico.innerHTML = `<i class="fas ${icon || (danger ? 'fa-triangle-exclamation' : 'fa-question')}"></i>`;

      $('confirmScrim').classList.add('on');
      $('confirmBox').classList.add('on');

      const cleanup = () => {
        $('confirmScrim').classList.remove('on');
        $('confirmBox').classList.remove('on');
        $('confirmOk').removeEventListener('click', onOk);
        $('confirmCancel').removeEventListener('click', onCancel);
        $('confirmScrim').removeEventListener('click', onCancel);
      };
      const onOk = () => { cleanup(); resolve(true); };
      const onCancel = () => { cleanup(); resolve(false); };
      $('confirmOk').addEventListener('click', onOk);
      $('confirmCancel').addEventListener('click', onCancel);
      $('confirmScrim').addEventListener('click', onCancel);
    });
  }

  /* ============================================================
     RENDER
     ============================================================ */
  function renderEntries() {
    const list = $('entriesList');
    if (!ENTRIES.length) {
      list.innerHTML = '<div class="empty"><i class="fas fa-inbox"></i>No entries yet.<br>Tap + to add one.</div>';
      return;
    }
    const sorted = [...ENTRIES].sort((a, b) => {
      const na = Number(a.slNo), nb = Number(b.slNo);
      if (!isNaN(na) && !isNaN(nb)) return nb - na;
      return String(b.slNo).localeCompare(String(a.slNo));
    });
    const groups = {};
    sorted.forEach(e => {
      const d = e.date || 'Unknown';
      (groups[d] = groups[d] || []).push(e);
    });
    const dates = Object.keys(groups).sort((a, b) => b.localeCompare(a));

    let html = '';
    dates.forEach(d => {
      html += `<div class="date-group">${esc(fmtDateDisplay(d) || d)}</div>`;
      groups[d].forEach(e => {
        html += `
          <div class="entry-row" data-slno="${esc(e.slNo)}">
            <div class="entry-info">
              <div class="name">${esc(e.name)}</div>
              <div class="cat"><i class="fas fa-tag"></i> ${esc(e.purpose)}</div>
            </div>
            <div class="entry-amount">₹${fmtMoney(e.amount)}</div>
            <div class="entry-actions">
              <button class="entry-edit" data-edit="${esc(e.slNo)}" aria-label="Edit"><i class="fas fa-pen"></i></button>
              <button class="entry-del" data-del="${esc(e.slNo)}" aria-label="Delete"><i class="fas fa-trash"></i></button>
            </div>
          </div>`;
      });
    });
    list.innerHTML = html;

    list.querySelectorAll('[data-edit]').forEach(b =>
      b.addEventListener('click', ev => { ev.stopPropagation(); requestEdit(b.dataset.edit); }));
    list.querySelectorAll('[data-del]').forEach(b =>
      b.addEventListener('click', ev => { ev.stopPropagation(); requestDelete(b.dataset.del); }));
  }

  /* ============================================================
     EDIT / DELETE
     ============================================================ */
  async function requestEdit(slNo) {
    const e = ENTRIES.find(x => x.slNo === slNo);
    if (!e) return;
    const ok = await askConfirm({
      title: 'Edit this record?',
      message: `Do you want to edit <b>${esc(e.name)}</b>'s payment of <b>₹${fmtMoney(e.amount)}</b>?`,
      okText: 'Edit', danger: false, icon: 'fa-pen-to-square'
    });
    if (ok) openForm(slNo);
  }

  async function requestDelete(slNo) {
    const e = ENTRIES.find(x => x.slNo === slNo);
    if (!e) return;
    const ok = await askConfirm({
      title: 'Delete this record?',
      message: `Are you sure you want to permanently delete <b>${esc(e.name)}</b>'s payment of <b>₹${fmtMoney(e.amount)}</b>?<br><br>This action <b>cannot be undone</b>.`,
      okText: 'Delete', danger: true, icon: 'fa-triangle-exclamation'
    });
    if (!ok) return;

    ENTRIES = ENTRIES.filter(x => x.slNo !== slNo);
    saveCache();
    renderEntries();
    toast('Entry deleted', 'ok');

    const r = await apiCall('deleteEntry', { slNo });
    if (r && r.success) {
      syncNow({ silent: true });
    } else {
      enqueue('deleteEntry', { slNo });
      toast('Offline — will sync later', 'err');
    }
  }

  /* ============================================================
     FORM
     ============================================================ */
  function openForm(editSlNo = null) {
    EDITING_SLNO = editSlNo;
    const form = $('entryForm');
    form.reset();
    $('formMsg').classList.add('hide');

    if (editSlNo) {
      const e = ENTRIES.find(x => x.slNo === editSlNo);
      if (e) {
        $('formTitle').innerHTML = '<i class="fas fa-pen-to-square"></i> Edit Entry';
        $('fSlNo').value = e.slNo;
        $('fDate').value = e.date || todayStr();
        $('fName').value = e.name || '';
        $('fPurpose').value = e.purpose || '';
        $('fAmount').value = e.amount || '';
      }
    } else {
      $('formTitle').innerHTML = '<i class="fas fa-plus-circle"></i> New Expenditure';
      $('fSlNo').value = '';
      $('fDate').value = todayStr();
      $('fName').value = '';
      $('fPurpose').value = '';
      $('fAmount').value = '';
    }

    updateBalanceDisplay();
    $('formScrim').classList.add('on');
    $('formSheet').classList.add('on');
  }

  function closeForm() {
    $('formScrim').classList.remove('on');
    $('formSheet').classList.remove('on');
  }

  $('btnAdd').addEventListener('click', () => openForm(null));
  $('formClose').addEventListener('click', closeForm);
  $('formScrim').addEventListener('click', closeForm);
  $('btnSync').addEventListener('click', () => syncNow({ silent: false }));

  /* ============================================================
     SUBMIT
     ============================================================ */
  $('entryForm').addEventListener('submit', async e => {
    e.preventDefault();
    const msg = $('formMsg');
    const btn = $('btnSubmit');

    const date = $('fDate').value;
    const name = $('fName').value.trim();
    const purpose = $('fPurpose').value.trim();
    const amount = $('fAmount').value;

    if (!date || !name || !purpose || !amount) {
      msg.className = 'msg er';
      msg.textContent = 'All fields are required.';
      return;
    }

    if (EDITING_SLNO) {
      const idx = ENTRIES.findIndex(x => x.slNo === EDITING_SLNO);
      if (idx >= 0) {
        ENTRIES[idx] = { ...ENTRIES[idx], date, name, purpose, amount: Number(amount) };
        saveCache();
        renderEntries();
      }
      msg.className = 'msg ok';
      msg.textContent = '✅ Updated';
      setTimeout(closeForm, 500);

      const r = await apiCall('updateEntry', { slNo: EDITING_SLNO, date, name, purpose, amount });
      if (!r || !r.success) {
        enqueue('updateEntry', { slNo: EDITING_SLNO, date, name, purpose, amount });
        toast('Offline — will sync later', 'err');
      } else {
        syncNow({ silent: true });
      }
      EDITING_SLNO = null;
      return;
    }

    const tempSlNo = 'tmp_' + Date.now();
    ENTRIES.push({ slNo: tempSlNo, date, name, purpose, amount: Number(amount) });
    saveCache();
    renderEntries();

    const original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> Saving…';

    const r = await apiCall('addEntry', { date, name, purpose, amount });

    btn.disabled = false;
    btn.innerHTML = original;

    if (r && r.success) {
      const realSlNo = r.data && r.data.slNo ? String(r.data.slNo) : tempSlNo;
      const idx = ENTRIES.findIndex(x => x.slNo === tempSlNo);
      if (idx >= 0) ENTRIES[idx].slNo = realSlNo;
      if (r.data && typeof r.data.liveBalance === 'number') LIVE_BALANCE = r.data.liveBalance;
      saveCache();
      renderEntries();
      updateBalanceDisplay();
      msg.className = 'msg ok';
      msg.textContent = '✅ Saved';
      toast('Entry added', 'ok');
      setTimeout(closeForm, 500);
      syncNow({ silent: true });
    } else {
      enqueue('addEntry', { date, name, purpose, amount });
      msg.className = 'msg ok';
      msg.textContent = '⚠️ Saved locally — will sync when online';
      toast('Saved locally', 'ok');
      setTimeout(closeForm, 700);
    }
  });

  /* ============================================================
     TOAST
     ============================================================ */
  let toastTimer = null;
  function toast(m, kind = '') {
    const t = $('toast');
    const ico = kind === 'ok' ? 'fa-circle-check' : kind === 'err' ? 'fa-circle-exclamation' : 'fa-circle-info';
    t.className = 'toast ' + kind;
    t.innerHTML = `<i class="fas ${ico}"></i> <span>${esc(m)}</span>`;
    t.classList.add('on');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
  }

  /* ============================================================
     BOOT
     ============================================================ */
  function boot() {
    updateQueueBadge();

    const cached = loadCache();
    if (cached) {
      ENTRIES = cached.entries;
      LIVE_BALANCE = cached.liveBalance || 0;
      updateBalanceDisplay();
      renderEntries();
      $('loadingState').style.display = 'none';
      updateSyncStatus('idle');
      syncNow({ silent: true });
    } else {
      updateSyncStatus('syncing');
      syncNow({ silent: false }).then(ok => {
        $('loadingState').style.display = 'none';
        if (!ok) {
          $('entriesList').innerHTML = '<div class="empty"><i class="fas fa-triangle-exclamation"></i>Failed to load.<br><small>Check connection &amp; Web App URL.</small></div>';
        }
      });
    }

    startStatusTicker();

    window.addEventListener('online', () => {
      toast('Back online — syncing…', 'ok');
      syncNow({ silent: true });
    });

    window.addEventListener('offline', () => {
      toast('Offline mode', 'err');
      updateSyncStatus('error');
    });

    setInterval(() => {
      if (document.visibilityState === 'visible') syncNow({ silent: true });
    }, 60000);

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') syncNow({ silent: true });
    });

    // Pull-to-refresh
    let touchStartY = 0;
    const main = $('main');
    main.addEventListener('touchstart', e => {
      if (main.scrollTop <= 0) touchStartY = e.touches[0].clientY;
      else touchStartY = 0;
    }, { passive: true });
    main.addEventListener('touchend', e => {
      if (!touchStartY) return;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (dy > 80) syncNow({ silent: false });
      touchStartY = 0;
    });
  }

  boot();
</script>
</body>
</html>
