<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0B1120">
<title>TV Player</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --bg-deep:#0B1120; --bg-surface:#131C2E; --bg-card:#1A253A; --bg-input:#0F172A;
    --primary:#3B82F6; --primary-light:#60A5FA; --primary-glow:rgba(59,130,246,0.25);
    --accent:#22D3EE; --success:#34D399; --danger:#F87171;
    --text-primary:#F1F5F9; --text-secondary:#94A3B8; --border-subtle:#2D3A52;
    --radius-md:12px; --radius-lg:16px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Roboto',system-ui,sans-serif;}
  html,body{height:100%;}
  body{background:var(--bg-deep);color:var(--text-primary);overflow:hidden;font-size:14px;
    -webkit-font-smoothing:antialiased;}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;}

  .app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:900px;
    margin:0 auto;background:var(--bg-deep);overflow:hidden;}

  /* ---- PLAYER ---- */
  .player-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;flex-shrink:0;
    box-shadow:0 8px 24px rgba(0,0,0,0.5);z-index:10;}
  .player-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .player-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:20px;
    background:radial-gradient(circle at center,rgba(59,130,246,0.1),transparent 60%),#000;
    color:var(--text-secondary);}
  .player-placeholder i{font-size:48px;color:var(--primary);margin-bottom:12px;opacity:0.85;}
  .player-placeholder h3{font-size:15px;color:var(--text-primary);margin-bottom:6px;font-weight:600;}
  .player-placeholder p{font-size:12.5px;max-width:320px;line-height:1.5;}

  /* ---- NOW PLAYING BAR ---- */
  .now-playing{padding:12px 18px;background:var(--bg-surface);border-bottom:1px solid var(--border-subtle);
    display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .now-playing .icon{width:32px;height:32px;border-radius:8px;background:var(--primary);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex-shrink:0;}
  .now-playing .txt{flex:1;min-width:0;}
  .now-playing .lbl{font-size:10px;font-weight:700;color:var(--primary-light);
    text-transform:uppercase;letter-spacing:0.8px;margin-bottom:2px;}
  .now-playing .title{font-size:13.5px;font-weight:600;color:var(--text-primary);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ---- SEARCH ---- */
  .search-bar{padding:12px 16px;background:var(--bg-deep);border-bottom:1px solid var(--border-subtle);}
  .search-wrap{display:flex;align-items:center;gap:10px;background:var(--bg-input);
    border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:0 14px;
    transition:border-color 0.15s,box-shadow 0.15s;}
  .search-wrap:focus-within{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-glow);}
  .search-wrap i{color:var(--primary-light);font-size:14px;flex-shrink:0;}
  .search-wrap input{flex:1;padding:12px 0;border:none;background:transparent;font-size:14px;
    font-weight:500;color:var(--text-primary);outline:none;min-width:0;}
  .search-wrap input::placeholder{color:#475569;}

  /* ---- LIST ---- */
  .main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px;}
  .main::-webkit-scrollbar{width:4px;}
  .main::-webkit-scrollbar-thumb{background:var(--border-subtle);border-radius:4px;}

  .video-row{background:var(--bg-card);padding:12px 14px;display:flex;align-items:center;gap:12px;
    margin:6px 12px;border-radius:var(--radius-md);border:1px solid var(--border-subtle);
    cursor:pointer;transition:transform 0.1s,background 0.15s;}
  .video-row:hover{background:#1F2A42;}
  .video-row:active{transform:scale(0.99);}
  .video-row.active{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-glow);}

  .video-thumb{width:56px;height:42px;border-radius:8px;background:var(--bg-input);
    display:flex;align-items:center;justify-content:center;color:var(--primary);
    font-size:18px;flex-shrink:0;overflow:hidden;}
  .video-thumb img{width:100%;height:100%;object-fit:cover;}

  .video-info{flex:1;min-width:0;}
  .video-info .num{font-size:10px;font-weight:700;color:var(--primary-light);
    text-transform:uppercase;letter-spacing:0.6px;margin-bottom:2px;}
  .video-info .desc{font-size:14px;font-weight:600;color:var(--text-primary);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .video-info .url{font-size:11px;color:var(--text-secondary);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .video-play-btn{width:34px;height:34px;border-radius:50%;background:var(--primary);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;
    flex-shrink:0;box-shadow:0 4px 12px var(--primary-glow);}

  /* ---- EMPTY / LOADING ---- */
  .empty,.loading{text-align:center;padding:60px 20px;color:var(--text-secondary);
    font-size:14px;font-weight:500;}
  .empty i{font-size:40px;display:block;margin-bottom:14px;opacity:0.4;color:var(--primary);}
  .loading .spin-lg{display:inline-block;width:36px;height:36px;border:3px solid var(--border-subtle);
    border-radius:50%;border-top-color:var(--primary);animation:spin 0.65s linear infinite;}
  .loading p{margin-top:14px;font-size:13px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---- TOAST ---- */
  .toast{position:fixed;bottom:calc(24px + var(--safe-bottom));left:50%;
    transform:translateX(-50%) translateY(80px);background:var(--bg-card);
    color:var(--text-primary);padding:12px 20px;border-radius:40px;font-size:13px;
    font-weight:600;box-shadow:0 12px 28px rgba(0,0,0,0.6);opacity:0;pointer-events:none;
    transition:opacity 0.25s,transform 0.25s;z-index:300;display:flex;align-items:center;gap:8px;
    border:1px solid var(--border-subtle);}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.err{background:#7F1D1D;border-color:#B91C1C;color:#FCA5A5;}
</style>
</head>
<body>

<div class="app">

  <!-- PLAYER -->
  <div class="player-wrap" id="playerWrap">
    <div class="player-placeholder" id="playerPlaceholder">
      <i class="fas fa-tv"></i>
      <h3>TV Player</h3>
      <p>Select a video from the list below to start playing</p>
    </div>
  </div>

  <!-- NOW PLAYING -->
  <div class="now-playing" id="nowPlaying" style="display:none;">
    <div class="icon"><i class="fas fa-play"></i></div>
    <div class="txt">
      <div class="lbl">Now Playing</div>
      <div class="title" id="nowTitle">—</div>
    </div>
  </div>

  <!-- SEARCH -->
  <div class="search-bar">
    <div class="search-wrap">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Search videos..." autocomplete="off">
    </div>
  </div>

  <!-- LIST -->
  <main class="main" id="main">
    <div class="loading" id="loadingState">
      <span class="spin-lg"></span>
      <p>Loading videos…</p>
    </div>
    <div id="videosList"></div>
  </main>

</div>

<div class="toast" id="toast"></div>

<script>
  /* ============================================================
     CONFIG
     ============================================================ */
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzTg5fd_7eOrSW38FHXIXYGb6Hx0XH2gP_YXMrNUZtsJgqW1jpN6Vr5r2Nmxsd6AtJ2/exec';

  /* ============================================================
     STATE
     ============================================================ */
  let VIDEOS = [];
  let CURRENT_SLNO = null;

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));

  /* ============================================================
     YOUTUBE ID EXTRACTOR
     ============================================================ */
  function extractYouTube(url) {
    if (!url) return null;
    let s = String(url).trim();
    if (/^[a-zA-Z0-9_-]{11}$/.test(s)) return { id: s, start: 0 };
    if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
    let u; try { u = new URL(s); } catch (e) { return null; }
    const host = u.hostname.replace(/^www\.|^m\./i, '').toLowerCase();
    const path = u.pathname, params = u.searchParams;
    let id = null;
    if (host === 'youtu.be') id = path.split('/').filter(Boolean)[0] || null;
    else if (host === 'youtube.com' || host === 'youtube-nocookie.com') {
      if (path === '/watch') id = params.get('v');
      else if (path.startsWith('/shorts/')) id = path.split('/')[2];
      else if (path.startsWith('/embed/'))  id = path.split('/')[2];
      else if (path.startsWith('/live/'))   id = path.split('/')[2];
      else if (path.startsWith('/v/'))      id = path.split('/')[2];
    }
    if (!id || !/^[a-zA-Z0-9_-]{11}$/.test(id)) return null;
    let start = 0;
    const t = params.get('t') || params.get('start');
    if (t) start = parseTimeParam(t);
    return { id, start };
  }

  function parseTimeParam(t) {
    t = String(t).trim();
    if (/^\d+$/.test(t)) return parseInt(t, 10);
    const m = t.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/i);
    if (!m) return 0;
    return (parseInt(m[1]||0,10)*3600) + (parseInt(m[2]||0,10)*60) + parseInt(m[3]||0,10);
  }

  function getThumbnail(id) {
    return `https://img.youtube.com/vi/${id}/mqdefault.jpg`;
  }

  /* ============================================================
     JSONP CALL
     ============================================================ */
  let jsonpCounter = 0;
  function apiCall(action, params = {}, timeout = 20000) {
    return new Promise(resolve => {
      const cb = '__cb_' + (++jsonpCounter) + '_' + Date.now();
      const sc = document.createElement('script');
      const done = ok => {
        delete window[cb];
        if (sc.parentNode) sc.parentNode.removeChild(sc);
        resolve(ok);
      };
      const t = setTimeout(() => done({ success: false, message: 'Timed out' }), timeout);
      window[cb] = d => { clearTimeout(t); done(d); };
      const q = new URLSearchParams({ action, callback: cb, ...params }).toString();
      sc.src = `${SCRIPT_URL}?${q}`;
      sc.onerror = () => { clearTimeout(t); done({ success: false, message: 'Network error' }); };
      document.body.appendChild(sc);
    });
  }

  /* ============================================================
     LOAD VIDEOS
     ============================================================ */
  async function loadVideos() {
    $('loadingState').style.display = 'block';
    $('videosList').innerHTML = '';

    const r = await apiCall('getVideos');

    if (!r || !r.success || !r.data) {
      $('loadingState').innerHTML = '<div class="empty"><i class="fas fa-triangle-exclamation"></i>Failed to load videos.<br><small>Check your Web App URL.</small></div>';
      return;
    }

    VIDEOS = r.data.videos || [];
    $('loadingState').style.display = 'none';
    renderVideos();
  }

  /* ============================================================
     RENDER LIST
     ============================================================ */
  function renderVideos() {
    const list = $('videosList');
    const query = ($('searchInput').value || '').toLowerCase().trim();

    let filtered = VIDEOS;
    if (query) {
      filtered = VIDEOS.filter(v =>
        (v.description || '').toLowerCase().includes(query) ||
        (v.url || '').toLowerCase().includes(query)
      );
    }

    if (!filtered.length) {
      list.innerHTML = '<div class="empty"><i class="fas fa-inbox"></i>' +
        (query ? 'No videos match your search.' : 'No videos in the sheet yet.<br>Add rows to the TV PLAYER sheet.') +
        '</div>';
      return;
    }

    let html = '';
    filtered.forEach(v => {
      const parsed = extractYouTube(v.url);
      const thumb = parsed ? getThumbnail(parsed.id) : null;
      const activeClass = (v.slNo === CURRENT_SLNO) ? ' active' : '';

      html += `
        <div class="video-row${activeClass}" data-slno="${esc(v.slNo)}">
          <div class="video-thumb">
            ${thumb ? `<img src="${thumb}" alt="" loading="lazy" onerror="this.style.display='none';this.parentNode.innerHTML='<i class=\\'fas fa-video\\'></i>'">` : '<i class="fas fa-video"></i>'}
          </div>
          <div class="video-info">
            <div class="num">Video #${esc(v.slNo)}</div>
            <div class="desc">${esc(v.description || 'Untitled')}</div>
            <div class="url">${esc(v.url || '')}</div>
          </div>
          <div class="video-play-btn"><i class="fas fa-play"></i></div>
        </div>
      `;
    });

    list.innerHTML = html;

    list.querySelectorAll('.video-row').forEach(row => {
      row.addEventListener('click', () => {
        const slNo = row.dataset.slno;
        const video = VIDEOS.find(v => v.slNo === slNo);
        if (video) playVideo(video);
      });
    });
  }

  /* ============================================================
     PLAY VIDEO
     ============================================================ */
  function playVideo(video) {
    const parsed = extractYouTube(video.url);
    if (!parsed) {
      toast('Invalid YouTube URL: ' + video.url, 'err');
      return;
    }

    const { id, start } = parsed;
    const params = new URLSearchParams({
      rel: '0',
      modestbranding: '1',
      playsinline: '1',
      autoplay: '1'
    });
    if (start > 0) params.set('start', String(start));

    const embedUrl = `https://www.youtube.com/embed/${id}?${params.toString()}`;

    $('playerWrap').innerHTML = `
      <iframe src="${embedUrl}" title="TV Player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
    `;

    $('nowTitle').textContent = video.description || 'Untitled';
    $('nowPlaying').style.display = 'flex';

    CURRENT_SLNO = video.slNo;
    renderVideos();

    toast('Now playing: ' + (video.description || 'Untitled'));
  }

  /* ============================================================
     SEARCH
     ============================================================ */
  $('searchInput').addEventListener('input', renderVideos);

  /* ============================================================
     TOAST
     ============================================================ */
  let toastTimer = null;
  function toast(m, kind = '') {
    const t = $('toast');
    const ico = kind === 'err' ? 'fa-circle-exclamation' : 'fa-circle-info';
    t.className = 'toast ' + kind;
    t.innerHTML = `<i class="fas ${ico}"></i> <span>${esc(m)}</span>`;
    t.classList.add('on');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
  }

  /* ============================================================
     INIT
     ============================================================ */
  loadVideos();
</script>
</body>
</html>
