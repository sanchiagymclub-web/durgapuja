<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2D1B4E">
<title>Collection 2026</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --primary:#A78BFA;
  --primary-dark:#7C3AED;
  --primary-light:#C4B5FD;
  --accent:#F0ABFC;
  --success:#4ADE80;
  --danger:#F87171;
  --bg-purple-1:#2D1B4E;
  --bg-purple-2:#1E1035;
  --bg-purple-3:#4C1D95;
  --bg-row:#2A1B47;
  --bg-card:#2E1D4F;
  --text-light:#F5F3FF;
  --text-muted:#A78BFA;
  --border:#4C3575;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Poppins','Roboto',system-ui,sans-serif;}
html,body{height:100%;}
body{
  background:linear-gradient(135deg,var(--bg-purple-1) 0%,var(--bg-purple-2) 50%,var(--bg-purple-3) 100%);
  background-attachment:fixed;
  color:var(--text-light);overflow:hidden;
  font-size:14px;-webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;}

.app{
  display:flex;flex-direction:column;height:100vh;height:100dvh;
  overflow:hidden;position:relative;
  max-width:520px;margin:0 auto;
  background:linear-gradient(160deg,rgba(45,27,78,.95),rgba(30,16,53,.98));
}

/* TOP BAR - 3D raised */
.appbar{
  display:flex;align-items:center;gap:10px;
  padding:calc(14px + var(--safe-top)) 14px 14px;
  background:linear-gradient(145deg,#7C3AED,#5B21B6);
  color:#fff;flex-shrink:0;
  box-shadow:
    0 6px 12px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.25),
    inset 0 -2px 0 rgba(0,0,0,.2);
  position:relative;z-index:50;
  border-bottom:2px solid rgba(196,181,253,.3);
}
.ab-icon{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.05));
  color:#fff;
  font-size:18px;flex-shrink:0;
  box-shadow:
    0 3px 6px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.2);
  transition:transform .12s,box-shadow .12s;
}
.ab-icon:active{
  transform:translateY(1px) scale(.95);
  box-shadow:0 1px 2px rgba(0,0,0,.3), inset 0 1px 2px rgba(0,0,0,.2);
}
.ab-title{flex:1;min-width:0;display:flex;align-items:center;gap:8px;}
.ab-title .flower{font-size:22px;color:var(--accent);}
.ab-title h1{
  font-size:18px;font-weight:800;letter-spacing:-.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.4);
}

/* MAIN */
.main{
  flex:1;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  background:transparent;
  position:relative;
  padding-bottom:90px;
}

.date-group{
  background:linear-gradient(90deg,rgba(124,58,237,.4),rgba(124,58,237,.15));
  padding:12px 16px 8px;
  font-size:16px;font-weight:800;color:var(--primary-light);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;
  z-index:10;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  letter-spacing:.3px;
}

.entry-row{
  background:linear-gradient(145deg,#34215C,#261641);
  padding:14px 16px;
  display:flex;align-items:center;gap:12px;
  margin:8px 10px;
  border-radius:14px;
  box-shadow:
    0 6px 12px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.08);
  transition:transform .12s,box-shadow .12s;
  position:relative;
}
.entry-row:active{
  transform:translateY(1px);
  box-shadow:0 2px 6px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
}
.entry-info{flex:1;min-width:0;}
.entry-info .name{
  font-size:15px;font-weight:700;color:var(--text-light);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.entry-info .cat{
  font-size:12px;color:var(--text-muted);margin-top:3px;
  font-weight:500;
}
.entry-amount{
  font-size:15px;font-weight:800;color:var(--accent);
  text-align:right;flex-shrink:0;
  text-shadow:0 1px 2px rgba(0,0,0,.3);
}

.entry-actions{
  display:flex;flex-direction:column;gap:6px;flex-shrink:0;
}
.entry-edit,
.entry-del{
  width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;
  flex-shrink:0;
  transition:transform .12s,box-shadow .12s;
}
.entry-edit{
  color:#A78BFA;
  background:linear-gradient(145deg,#3D2A6B,#2A1B47);
  box-shadow:
    0 3px 6px rgba(0,0,0,.3),
    inset 0 1px 0 rgba(255,255,255,.1);
}
.entry-del{
  color:#F87171;
  background:linear-gradient(145deg,#4A1F3D,#331529);
  box-shadow:
    0 3px 6px rgba(0,0,0,.3),
    inset 0 1px 0 rgba(255,255,255,.1);
}
.entry-edit:active,
.entry-del:active{
  transform:translateY(1px);
  box-shadow:0 1px 2px rgba(0,0,0,.3);
}

/* FAB - 3D raised */
.fab{
  position:fixed;
  bottom:calc(24px + var(--safe-bottom));
  right:calc(20px + (100vw - min(520px, 100vw))/2);
  width:62px;height:62px;border-radius:50%;
  background:linear-gradient(145deg,#A78BFA,#7C3AED);
  color:#fff;font-size:26px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:
    0 10px 20px rgba(124,58,237,.5),
    0 4px 8px rgba(0,0,0,.3),
    inset 0 2px 0 rgba(255,255,255,.3),
    inset 0 -2px 0 rgba(0,0,0,.15);
  z-index:100;
  transition:transform .12s,box-shadow .12s;
}
.fab:active{
  transform:translateY(2px) scale(.96);
  box-shadow:
    0 4px 8px rgba(124,58,237,.4),
    0 2px 4px rgba(0,0,0,.3),
    inset 0 2px 0 rgba(255,255,255,.3);
}

/* SHEET */
.sheet-scrim{
  position:fixed;inset:0;
  background:rgba(15,8,35,.8);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .25s ease;
  z-index:200;
}
.sheet-scrim.on{opacity:1;pointer-events:auto;}
.sheet{
  position:fixed;left:0;right:0;bottom:0;
  max-width:520px;margin:0 auto;
  background:linear-gradient(160deg,#2E1D4F,#1E1035);
  border-radius:28px 28px 0 0;
  transform:translateY(105%);
  transition:transform .32s cubic-bezier(.4,0,.2,1);
  z-index:210;display:flex;flex-direction:column;
  max-height:92vh;max-height:92dvh;
  box-shadow:
    0 -12px 40px rgba(0,0,0,.6),
    inset 0 2px 0 rgba(196,181,253,.2);
  padding-bottom:var(--safe-bottom);
  border-top:2px solid rgba(167,139,250,.3);
}
.sheet.on{transform:translateY(0);}
.sheet-grip{
  width:44px;height:5px;border-radius:3px;
  background:linear-gradient(90deg,#7C3AED,#A78BFA);
  margin:10px auto 4px;flex-shrink:0;
  box-shadow:0 2px 4px rgba(0,0,0,.3);
}
.sheet-head{
  padding:6px 20px 14px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.sheet-head h2{
  font-size:17px;font-weight:800;letter-spacing:-.3px;
  color:var(--text-light);
}
.sheet-head h2 i{color:var(--primary);margin-right:8px;}
.sheet-close{
  width:36px;height:36px;border-radius:50%;
  background:linear-gradient(145deg,#3D2A6B,#2A1B47);
  color:#C4B5FD;font-size:14px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 6px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.1);
  transition:transform .12s;
}
.sheet-close:active{transform:translateY(1px);}
.sheet-body{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 20px 20px;
}

/* FIELDS - 3D raised inputs */
.field{margin-bottom:16px;}
.field label{
  display:block;font-size:11px;font-weight:800;
  color:var(--primary-light);text-transform:uppercase;
  letter-spacing:.6px;margin-bottom:8px;
}
.field .in{
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(145deg,#1F1236,#261641);
  border:1.5px solid rgba(167,139,250,.25);
  border-radius:14px;padding:0 14px;
  box-shadow:
    inset 0 2px 4px rgba(0,0,0,.4),
    0 1px 0 rgba(255,255,255,.05);
  transition:border-color .15s,box-shadow .15s;
}
.field .in:focus-within{
  border-color:var(--primary);
  box-shadow:
    inset 0 2px 4px rgba(0,0,0,.3),
    0 0 0 4px rgba(167,139,250,.15);
}
.field .in i{color:var(--primary);font-size:15px;flex-shrink:0;}
.field .in input,
.field .in select{
  flex:1;padding:14px 0;border:none;background:transparent;
  font-size:15px;font-weight:600;color:var(--text-light);outline:none;
  min-width:0;
  color-scheme:dark;
}
.field .in input::placeholder{color:#6B5B95;}

/* ============================================================
   CHIP STYLE SELECTORS (Category / Address) - 3D raised
   ============================================================ */
.chips-row{
  display:flex;flex-wrap:wrap;gap:8px;
}
.chip-opt{
  flex:1 1 calc(50% - 4px);
  min-width:120px;
  padding:14px 10px;
  background:linear-gradient(145deg,#2A1B47,#1F1236);
  border:1.5px solid rgba(167,139,250,.2);
  border-radius:12px;
  color:var(--text-light);
  font-size:14px;font-weight:600;
  text-align:center;
  transition:all .15s ease;
  user-select:none;-webkit-user-select:none;
  box-shadow:
    0 4px 8px rgba(0,0,0,.3),
    inset 0 1px 0 rgba(255,255,255,.08);
}
.chip-opt:active{
  transform:translateY(1px);
  box-shadow:0 2px 4px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.08);
}
.chip-opt.selected{
  background:linear-gradient(145deg,#A78BFA,#7C3AED);
  border-color:#C4B5FD;
  color:#1a0d2e;
  font-weight:800;
  box-shadow:
    0 6px 12px rgba(124,58,237,.5),
    inset 0 2px 0 rgba(255,255,255,.4),
    inset 0 -2px 0 rgba(0,0,0,.1);
}

/* balance display - 3D */
.balance-display{
  background:linear-gradient(145deg,#3D2A6B,#2A1B47);
  border:1.5px solid rgba(167,139,250,.4);
  border-radius:16px;
  padding:16px 18px;
  margin-bottom:18px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:
    0 8px 16px rgba(0,0,0,.35),
    inset 0 2px 0 rgba(255,255,255,.1),
    inset 0 -2px 0 rgba(0,0,0,.15);
}
.balance-display .lbl{
  font-size:12px;font-weight:800;color:var(--primary-light);
  text-transform:uppercase;letter-spacing:.6px;
  display:flex;align-items:center;gap:6px;
}
.balance-display .val{
  font-size:22px;font-weight:900;color:var(--accent);
  text-shadow:0 2px 4px rgba(240,171,252,.3);
}

/* BUTTONS - 3D raised */
.btn{
  width:100%;padding:16px;
  background:linear-gradient(145deg,#A78BFA,#7C3AED);
  border-radius:14px;color:#1a0d2e;
  font-weight:900;font-size:15px;letter-spacing:.3px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:
    0 8px 16px rgba(124,58,237,.5),
    inset 0 2px 0 rgba(255,255,255,.4),
    inset 0 -2px 0 rgba(0,0,0,.15);
  transition:transform .1s,box-shadow .1s;
  margin-top:10px;
}
.btn:active{
  transform:translateY(2px);
  box-shadow:
    0 4px 8px rgba(124,58,237,.4),
    inset 0 2px 0 rgba(255,255,255,.3);
}
.btn:disabled{opacity:.55;pointer-events:none;}

.btn-danger{
  background:linear-gradient(145deg,#F87171,#DC2626);
  box-shadow:
    0 8px 16px rgba(220,38,38,.5),
    inset 0 2px 0 rgba(255,255,255,.3),
    inset 0 -2px 0 rgba(0,0,0,.15);
  color:#fff;
}

.msg{
  font-size:13px;font-weight:600;padding:12px 14px;
  border-radius:12px;margin-top:14px;
  display:flex;align-items:flex-start;gap:8px;
  animation:fadeUp .22s ease;line-height:1.4;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(6px);}
  to{opacity:1;transform:translateY(0);}
}
.msg.ok{background:rgba(74,222,128,.15);color:#4ADE80;border:1px solid rgba(74,222,128,.3);}
.msg.er{background:rgba(248,113,113,.15);color:#F87171;border:1px solid rgba(248,113,113,.3);}
.msg.hide{display:none;}

.spin{
  display:inline-block;width:16px;height:16px;
  border:2px solid rgba(0,0,0,.2);border-radius:50%;
  border-top-color:#1a0d2e;animation:spin .65s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

.toast{
  position:fixed;bottom:calc(90px + var(--safe-bottom));
  left:50%;transform:translateX(-50%) translateY(80px);
  background:linear-gradient(145deg,#4C1D95,#2D1B4E);
  color:#fff;
  padding:14px 22px;border-radius:40px;
  font-size:13px;font-weight:700;
  box-shadow:
    0 12px 28px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.2);
  opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;
  z-index:300;display:flex;align-items:center;gap:8px;
  max-width:calc(100vw - 40px);
  border:1px solid rgba(167,139,250,.3);
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.err{background:linear-gradient(145deg,#B91C1C,#7F1D1D);}
.toast.ok {background:linear-gradient(145deg,#047857,#065F46);}

.empty{
  text-align:center;padding:50px 20px;color:var(--text-muted);
  font-size:14px;font-weight:600;
}
.empty i{font-size:40px;display:block;margin-bottom:14px;opacity:.5;}

.loading{text-align:center;padding:40px 20px;}
.loading .spin-lg{
  display:inline-block;width:36px;height:36px;
  border:3px solid rgba(167,139,250,.2);border-radius:50%;
  border-top-color:var(--primary);animation:spin .65s linear infinite;
}
.loading p{margin-top:12px;color:var(--text-muted);font-size:13px;}

/* ============================================================
   CONFIRM MODAL - 3D raised
   ============================================================ */
.confirm-scrim{
  position:fixed;inset:0;background:rgba(15,8,35,.85);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .25s ease;
  z-index:400;
}
.confirm-scrim.on{opacity:1;pointer-events:auto;}

.confirm-box{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(.9);
  width:calc(100% - 40px);max-width:360px;
  background:linear-gradient(160deg,#2E1D4F,#1E1035);
  border-radius:20px;
  padding:24px 22px 20px;
  z-index:410;
  opacity:0;pointer-events:none;
  transition:opacity .22s ease,transform .22s cubic-bezier(.4,0,.2,1);
  box-shadow:
    0 20px 50px rgba(0,0,0,.6),
    inset 0 2px 0 rgba(196,181,253,.2),
    0 0 0 2px rgba(167,139,250,.2);
  text-align:center;
}
.confirm-box.on{
  opacity:1;pointer-events:auto;
  transform:translate(-50%,-50%) scale(1);
}
.confirm-icon{
  width:64px;height:64px;border-radius:50%;
  margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;
  background:linear-gradient(145deg,#4C1D95,#2D1B4E);
  box-shadow:
    0 8px 16px rgba(0,0,0,.4),
    inset 0 2px 0 rgba(255,255,255,.15);
}
.confirm-icon.warn{color:#FBBF24;}
.confirm-icon.danger{color:#F87171;background:linear-gradient(145deg,#7F1D1D,#4C0F0F);}
.confirm-title{
  font-size:17px;font-weight:800;color:var(--text-light);
  margin-bottom:8px;letter-spacing:-.2px;
}
.confirm-msg{
  font-size:13.5px;color:var(--text-muted);
  line-height:1.5;margin-bottom:20px;font-weight:500;
}
.confirm-msg b{color:var(--primary-light);font-weight:700;}
.confirm-actions{
  display:flex;gap:10px;
}
.confirm-btn{
  flex:1;padding:13px;
  border-radius:12px;
  font-weight:800;font-size:14px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .1s,box-shadow .1s;
}
.confirm-btn.cancel{
  background:linear-gradient(145deg,#3D2A6B,#2A1B47);
  color:#C4B5FD;
  box-shadow:0 4px 8px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.1);
}
.confirm-btn.ok{
  background:linear-gradient(145deg,#A78BFA,#7C3AED);
  color:#1a0d2e;
  box-shadow:
    0 6px 12px rgba(124,58,237,.5),
    inset 0 2px 0 rgba(255,255,255,.3);
}
.confirm-btn.danger{
  background:linear-gradient(145deg,#F87171,#DC2626);
  color:#fff;
  box-shadow:
    0 6px 12px rgba(220,38,38,.5),
    inset 0 2px 0 rgba(255,255,255,.2);
}
.confirm-btn:active{transform:translateY(1px);}
</style>
</head>
<body>

<div class="app">
  <header class="appbar">
    <button class="ab-icon" id="btnMenu" aria-label="Menu"><i class="fas fa-bars"></i></button>
    <div class="ab-title">
      <span class="flower">✿</span>
      <h1>Collection 2026</h1>
    </div>
    <button class="ab-icon" id="btnSearch" aria-label="Search"><i class="fas fa-search"></i></button>
    <button class="ab-icon" id="btnRefresh" aria-label="Refresh"><i class="fas fa-rotate"></i></button>
  </header>

  <main class="main" id="main">
    <div class="loading" id="loadingState">
      <span class="spin-lg"></span>
      <p>Loading entries…</p>
    </div>
    <div id="entriesList"></div>
  </main>

  <button class="fab" id="btnAdd" aria-label="Add entry"><i class="fas fa-plus"></i></button>
</div>

<!-- BOTTOM SHEET -->
<div class="sheet-scrim" id="formScrim"></div>
<section class="sheet" id="formSheet">
  <div class="sheet-grip"></div>
  <div class="sheet-head">
    <h2 id="formTitle"><i class="fas fa-plus-circle"></i> New Entry</h2>
    <button class="sheet-close" id="formClose"><i class="fas fa-xmark"></i></button>
  </div>
  <div class="sheet-body">
    <div class="balance-display">
      <span class="lbl"><i class="fas fa-wallet"></i> Live Balance</span>
      <span class="val" id="liveBalance">₹0</span>
    </div>

    <form id="entryForm">
      <!-- Sl No removed from view; kept as hidden input -->
      <input type="hidden" id="fSlNo">

      <div class="field">
        <label>Date</label>
        <div class="in">
          <i class="fas fa-calendar-day"></i>
          <input type="date" id="fDate" required>
        </div>
      </div>

      <!-- CATEGORY CHIPS -->
      <div class="field">
        <label>Category</label>
        <div class="chips-row" id="categoryChips">
          <button type="button" class="chip-opt" data-value="Member">Member</button>
          <button type="button" class="chip-opt" data-value="Villager">Villager</button>
          <button type="button" class="chip-opt" data-value="Others">Others</button>
        </div>
        <input type="hidden" id="fCategory" required>
      </div>

      <!-- ADDRESS CHIPS -->
      <div class="field">
        <label>Address</label>
        <div class="chips-row" id="addressChips">
          <button type="button" class="chip-opt" data-value="Uttarpara">Uttarpara</button>
          <button type="button" class="chip-opt" data-value="Purbapara">Purbapara</button>
          <button type="button" class="chip-opt" data-value="Paschimpara">Paschimpara</button>
          <button type="button" class="chip-opt" data-value="Dhampura">Dhampura</button>
          <button type="button" class="chip-opt" data-value="Madhyapara">Madhyapara</button>
          <button type="button" class="chip-opt" data-value="Dakshinpara">Dakshinpara</button>
          <button type="button" class="chip-opt" data-value="Samsi">Samsi</button>
          <button type="button" class="chip-opt" data-value="Others">Others</button>
        </div>
        <input type="hidden" id="fAddress" required>
      </div>

      <div class="field">
        <label>Name</label>
        <div class="in">
          <i class="fas fa-user"></i>
          <input type="text" id="fName" placeholder="Full name" required>
        </div>
      </div>

      <div class="field">
        <label>Amount (₹)</label>
        <div class="in">
          <i class="fas fa-indian-rupee-sign"></i>
          <input type="number" id="fAmount" placeholder="0" inputmode="numeric" required min="1">
        </div>
      </div>

      <button type="submit" class="btn" id="btnSubmit">
        <i class="fas fa-check"></i> Save Entry
      </button>
      <div class="msg hide" id="formMsg"></div>
    </form>
  </div>
</section>

<!-- CONFIRM MODAL -->
<div class="confirm-scrim" id="confirmScrim"></div>
<div class="confirm-box" id="confirmBox">
  <div class="confirm-icon" id="confirmIcon"><i class="fas fa-question"></i></div>
  <div class="confirm-title" id="confirmTitle">Are you sure?</div>
  <div class="confirm-msg" id="confirmMsg">This action cannot be undone.</div>
  <div class="confirm-actions">
    <button class="confirm-btn cancel" id="confirmCancel"><i class="fas fa-xmark"></i> Cancel</button>
    <button class="confirm-btn ok" id="confirmOk"><i class="fas fa-check"></i> Confirm</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx6B4RZODbTTp0Ii4ma2wDk-fKOmrZmIIQg3K2tdQqE6I_on3X26HgOGmdA9RFwwdrS/exec';

/* ============================================================
   STATE
   ============================================================ */
let ENTRIES = [];
let LIVE_BALANCE = 0;
let EDITING_SLNO = null;

/* HELPERS */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function todayStr(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function fmtDateDisplay(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  return `${d.getMonth()+1}/${d.getDate()}/${d.getFullYear()}`;
}
function fmtMoney(n){
  const num = Number(n) || 0;
  return num.toLocaleString('en-IN');
}

/* ============================================================
   CHIP SELECTOR
   ============================================================ */
function bindChips(containerId, hiddenInputId){
  const container = $(containerId);
  const hidden = $(hiddenInputId);
  container.querySelectorAll('.chip-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      container.querySelectorAll('.chip-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      hidden.value = btn.dataset.value;
    });
  });
}
function setChipValue(containerId, hiddenInputId, value){
  const container = $(containerId);
  const hidden = $(hiddenInputId);
  let found = false;
  container.querySelectorAll('.chip-opt').forEach(b => {
    if(b.dataset.value === value){
      b.classList.add('selected');
      hidden.value = value;
      found = true;
    } else {
      b.classList.remove('selected');
    }
  });
  if(!found) hidden.value = '';
}
function clearChips(containerId, hiddenInputId){
  $(containerId).querySelectorAll('.chip-opt').forEach(b => b.classList.remove('selected'));
  $(hiddenInputId).value = '';
}
bindChips('categoryChips', 'fCategory');
bindChips('addressChips',  'fAddress');

/* ============================================================
   CONFIRM MODAL
   ============================================================ */
function askConfirm(opts){
  return new Promise(resolve => {
    const {title, message, okText, danger, icon} = opts;
    $('confirmTitle').textContent = title;
    $('confirmMsg').innerHTML = message;
    const okBtn = $('confirmOk');
    okBtn.innerHTML = `<i class="fas ${danger?'fa-trash':'fa-check'}"></i> ${okText}`;
    okBtn.className = 'confirm-btn ' + (danger ? 'danger' : 'ok');
    const ico = $('confirmIcon');
    ico.className = 'confirm-icon ' + (danger ? 'danger' : 'warn');
    ico.innerHTML = `<i class="fas ${icon || (danger?'fa-triangle-exclamation':'fa-question')}"></i>`;

    $('confirmScrim').classList.add('on');
    $('confirmBox').classList.add('on');

    const cleanup = () => {
      $('confirmScrim').classList.remove('on');
      $('confirmBox').classList.remove('on');
      $('confirmOk').removeEventListener('click', onOk);
      $('confirmCancel').removeEventListener('click', onCancel);
      $('confirmScrim').removeEventListener('click', onCancel);
    };
    const onOk = () => { cleanup(); resolve(true); };
    const onCancel = () => { cleanup(); resolve(false); };

    $('confirmOk').addEventListener('click', onOk);
    $('confirmCancel').addEventListener('click', onCancel);
    $('confirmScrim').addEventListener('click', onCancel);
  });
}

/* ============================================================
   JSONP CALL
   ============================================================ */
let jsonpCounter = 0;
function apiCall(action, params = {}, timeout = 20000){
  return new Promise(resolve => {
    const cb = '__cb_' + (++jsonpCounter) + '_' + Date.now();
    const sc = document.createElement('script');
    const done = ok => {
      delete window[cb];
      if(sc.parentNode) sc.parentNode.removeChild(sc);
      resolve(ok);
    };
    const t = setTimeout(() => done({success:false, message:'Timed out'}), timeout);
    window[cb] = d => { clearTimeout(t); done(d); };
    const q = new URLSearchParams({ action, callback: cb, ...params }).toString();
    sc.src = `${SCRIPT_URL}?${q}`;
    sc.onerror = () => { clearTimeout(t); done({success:false, message:'Network error'}); };
    document.body.appendChild(sc);
  });
}

/* ============================================================
   LOAD ENTRIES
   ============================================================ */
async function loadEntries(){
  $('loadingState').style.display = 'block';
  $('entriesList').innerHTML = '';

  const r = await apiCall('getEntries');

  if(!r || !r.success || !r.data){
    $('loadingState').innerHTML = '<div class="empty"><i class="fas fa-triangle-exclamation"></i>Failed to load data.<br><small>Check your Web App URL &amp; deployment.</small></div>';
    return;
  }

  ENTRIES = r.data.entries || [];
  LIVE_BALANCE = r.data.liveBalance || 0;
  $('liveBalance').textContent = '₹' + fmtMoney(LIVE_BALANCE);
  renderEntries();
  $('loadingState').style.display = 'none';
}

/* ============================================================
   RENDER LIST
   ============================================================ */
function renderEntries(){
  const list = $('entriesList');
  if(!ENTRIES.length){
    list.innerHTML = '<div class="empty"><i class="fas fa-inbox"></i>No entries yet.<br>Tap + to add one.</div>';
    return;
  }

  const sorted = [...ENTRIES].sort((a,b) => {
    const na = Number(a.slNo), nb = Number(b.slNo);
    if(!isNaN(na) && !isNaN(nb)) return nb - na;
    return String(b.slNo).localeCompare(String(a.slNo));
  });

  const groups = {};
  sorted.forEach(e => {
    const d = e.date || 'Unknown';
    if(!groups[d]) groups[d] = [];
    groups[d].push(e);
  });

  const dates = Object.keys(groups).sort((a,b) => b.localeCompare(a));

  let html = '';
  dates.forEach(d => {
    html += `<div class="date-group">${esc(fmtDateDisplay(d) || d)}</div>`;
    groups[d].forEach(e => {
      html += `
        <div class="entry-row" data-slno="${esc(e.slNo)}">
          <div class="entry-info">
            <div class="name">${esc(e.name)}</div>
            <div class="cat">${esc(e.category)}${e.address ? ' · ' + esc(e.address) : ''}</div>
          </div>
          <div class="entry-amount">₹${fmtMoney(e.amount)}</div>
          <div class="entry-actions">
            <button class="entry-edit" data-edit="${esc(e.slNo)}" aria-label="Edit">
              <i class="fas fa-pen"></i>
            </button>
            <button class="entry-del" data-del="${esc(e.slNo)}" aria-label="Delete">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </div>
      `;
    });
  });

  list.innerHTML = html;

  list.querySelectorAll('[data-edit]').forEach(b => {
    b.addEventListener('click', ev => { ev.stopPropagation(); requestEdit(b.dataset.edit); });
  });
  list.querySelectorAll('[data-del]').forEach(b => {
    b.addEventListener('click', ev => { ev.stopPropagation(); requestDelete(b.dataset.del); });
  });
}

/* ============================================================
   EDIT FLOW (with confirmation)
   ============================================================ */
async function requestEdit(slNo){
  const e = ENTRIES.find(x => x.slNo === slNo);
  if(!e) return;
  const ok = await askConfirm({
    title: 'Edit this record?',
    message: `Do you want to edit <b>${esc(e.name)}</b>'s entry of <b>₹${fmtMoney(e.amount)}</b>?`,
    okText: 'Edit',
    danger: false,
    icon: 'fa-pen-to-square'
  });
  if(ok) openForm(slNo);
}

/* ============================================================
   DELETE FLOW (with confirmation)
   ============================================================ */
async function requestDelete(slNo){
  const e = ENTRIES.find(x => x.slNo === slNo);
  if(!e) return;
  const ok = await askConfirm({
    title: 'Delete this record?',
    message: `Are you sure you want to permanently delete <b>${esc(e.name)}</b>'s entry of <b>₹${fmtMoney(e.amount)}</b>?<br><br>This action <b>cannot be undone</b>.`,
    okText: 'Delete',
    danger: true,
    icon: 'fa-triangle-exclamation'
  });
  if(!ok) return;

  const r = await apiCall('deleteEntry', { slNo });
  if(r && r.success){
    toast('Entry deleted', 'ok');
    await loadEntries();
  } else {
    toast((r && r.message) || 'Delete failed', 'err');
  }
}

/* ============================================================
   OPEN / CLOSE FORM
   ============================================================ */
function openForm(editSlNo = null){
  EDITING_SLNO = editSlNo;
  const form = $('entryForm');
  form.reset();
  $('formMsg').classList.add('hide');
  clearChips('categoryChips', 'fCategory');
  clearChips('addressChips',  'fAddress');

  if(editSlNo){
    const e = ENTRIES.find(x => x.slNo === editSlNo);
    if(e){
      $('formTitle').innerHTML = '<i class="fas fa-pen-to-square"></i> Edit Entry';
      $('fSlNo').value = e.slNo;
      $('fDate').value = e.date || todayStr();
      setChipValue('categoryChips', 'fCategory', e.category);
      setChipValue('addressChips',  'fAddress',  e.address);
      $('fName').value = e.name || '';
      $('fAmount').value = e.amount || '';
    }
  } else {
    $('formTitle').innerHTML = '<i class="fas fa-plus-circle"></i> New Entry';
    $('fSlNo').value = '';
    $('fDate').value = todayStr();
    $('fName').value = '';
    $('fAmount').value = '';
  }

  $('liveBalance').textContent = '₹' + fmtMoney(LIVE_BALANCE);
  $('formScrim').classList.add('on');
  $('formSheet').classList.add('on');
}
function closeForm(){
  $('formScrim').classList.remove('on');
  $('formSheet').classList.remove('on');
}

$('btnAdd').addEventListener('click', () => openForm(null));
$('formClose').addEventListener('click', closeForm);
$('formScrim').addEventListener('click', closeForm);

/* ============================================================
   SUBMIT
   ============================================================ */
$('entryForm').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = $('formMsg');
  const btn = $('btnSubmit');

  const date = $('fDate').value;
  const category = $('fCategory').value;
  const address = $('fAddress').value;
  const name = $('fName').value.trim();
  const amount = $('fAmount').value;

  if(!date || !category || !address || !name || !amount){
    msg.className = 'msg er';
    msg.textContent = 'All fields are required.';
    return;
  }

  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> Saving…';

  const payload = { date, category, address, name, amount };
  if(EDITING_SLNO) payload.slNo = EDITING_SLNO;

  const action = EDITING_SLNO ? 'updateEntry' : 'addEntry';
  const r = await apiCall(action, payload);

  btn.disabled = false;
  btn.innerHTML = original;

  if(r && r.success){
    msg.className = 'msg ok';
    msg.textContent = '✅ ' + (r.message || 'Saved successfully!');
    toast(EDITING_SLNO ? 'Entry updated' : 'Entry added', 'ok');
    setTimeout(async () => {
      closeForm();
      await loadEntries();
    }, 700);
  } else {
    msg.className = 'msg er';
    msg.textContent = '❌ ' + ((r && r.message) || 'Save failed.');
  }
});

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer = null;
function toast(m, kind=''){
  const t = $('toast');
  const ico = kind==='ok' ? 'fa-circle-check' : kind==='err' ? 'fa-circle-exclamation' : 'fa-circle-info';
  t.className = 'toast ' + kind;
  t.innerHTML = `<i class="fas ${ico}"></i> <span>${esc(m)}</span>`;
  t.classList.add('on');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
}

/* ============================================================
   TOP BAR
   ============================================================ */
$('btnRefresh').addEventListener('click', () => {
  toast('Refreshing…');
  loadEntries();
});
$('btnMenu').addEventListener('click', () => toast('Menu coming soon'));
$('btnSearch').addEventListener('click', () => toast('Search coming soon'));

/* ============================================================
   INIT
   ============================================================ */
loadEntries();
</script>
</body>
</html>
